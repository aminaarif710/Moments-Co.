<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule Event</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #D7CCC8, #BCAAA4, #A1887F, #EFEBE9);
      color: #5D4037;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 1s ease-in-out;
      animation: gradientFlow 10s ease infinite;
    }
    .explore{
      margin-top: 40px;
    }
    .subscribe button{
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 25px;

    }
    .subscribe button:hover{
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 25px;
      color: white;
      background-color: #302214;
    }
    .subscribe input{
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
    }
    .form-container {
        background: linear-gradient(to bottom right, #D7CCC8, #BCAAA4);
        padding: 50px 40px;
        border-radius: 16px;
        width: 100%;
        max-width: 650px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        position: relative;
        color: #D7CCC8;
        animation: slideUp 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes slideUp {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .back-arrow {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      text-decoration: none;
      color: #D7CCC8;
      background-color: #5D4037;
      padding: 6px 12px;
      border-radius: 50px;
      transition: background 0.3s;
      animation: slideFromLeft 0.6s ease-out;
    }

    @keyframes slideFromLeft {
      0% { transform: translateX(-20px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    .back-arrow:hover {
      background-color: #685855;
    }

    h2 {
      text-align: center;
      font-size: 2.5em;
      color: #8c7b75;
      margin-bottom: 30px;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    label {
        color: #5D4037;
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
      animation: fadeIn 1.2s ease-out;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid  #634e43;;
      border-radius: 8px;
      background-color: #D7CCC8;
      color: #5D4037;
      font-size: 1em;
      box-sizing: border-box;
      animation: fadeIn 1.4s ease-out;
    }

    input::placeholder, textarea::placeholder {
      color:#5D4037;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      background-color: #5D4037;
      color: #EFEBE9;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      text-align: center;
      transition: background-color 0.3s ease;
      animation: fadeIn 1.6s ease-out;
    }

    .btn:hover {
      background-color: #3E2723;
    }

    @keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

  </style>
</head>
<body>

  <div class="form-container">
    <a href="p.html" class="back-arrow">&#8592;</a>
    <h2>Schedule Event</h2>
    <form>
      <label for="title">Event Title</label>
      <input type="text" id="title" placeholder="Enter event title" required>

      <label for="date">Date</label>
      <input type="date" id="date" required>

      <label for="time">Time</label>
      <input type="time" id="time" required>

      <label for="location">Location</label>
      <input type="text" id="location" placeholder="Event location">

      <label for="type">Type</label>
      <select id="type">
        <option>Conference</option>
        <option>Workshop</option>
        <option>Meetup</option>
        <option>Seminar</option>
        <option>Webinar</option>
        <option>Networking Event</option>
        <option>Panel Discussion</option>
        <option>Product Launch</option>
        <option>Charity Gala</option>
        <option>Hackathon</option>
        <option>Bridal Shower</option>
        <option>Birthday Party</option>
        <option>Baby Shower</option>
        <option>Reunion</option>
        <option>Farewell</option>
        <option>Concert</option>
        <option>Themed Party</option>
        <option>Award Ceremony</option>
        <option>Exhibition</option>
      </select>
      

      <label for="duration">Duration (hours)</label>
      <input type="number" id="duration" placeholder="e.g., 2" required>

      <label for="description">Description</label>
      <textarea id="description" placeholder="Event details..."></textarea>

      <label for="image">Upload Image</label>
      <input type="file" id="image">

      <label for="reminder">Reminder</label>
      <select id="reminder">
        <option>1 Day Before</option>
        <option>2 Hours Before</option>
      </select>

      <button type="button" class="btn" onclick="saveAndProceed()">Proceed</button>
    </form>
    <script>
      function saveAndProceed() {
        localStorage.setItem("eventTitle", document.getElementById("title").value);
        localStorage.setItem("eventDate", document.getElementById("date").value);
        localStorage.setItem("eventTime", document.getElementById("time").value);
        localStorage.setItem("eventLocation", document.getElementById("location").value);
        localStorage.setItem("eventDuration", document.getElementById("duration").value);
        window.location.href = "payement.html";
      }
    </script>
  </div>

</body>
</html>
